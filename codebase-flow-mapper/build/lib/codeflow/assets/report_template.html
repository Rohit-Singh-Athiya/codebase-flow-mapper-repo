<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codebase map</title>
<style>
/*__FONTS__*/
:root {
  --ground: #e8edeb; --sheet: #fafcfb; --ink: #12201c; --muted: #52625c; --line: #c3cfc9;
  --teal: #0f5c6b; --teal-soft: #d6e8e8; --on-teal: #ffffff; --orange: #d9480f; --grid: #cdd9d4;
  --sans: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0b1412; --sheet: #111c19; --ink: #e2eee9; --muted: #8ea39b; --line: #25352f;
    --teal: #5cc2cf; --teal-soft: #16323a; --on-teal: #08201f; --orange: #ff8a4c; --grid: #1a2a25;
  }
}
:root[data-theme="dark"] {
  --ground: #0b1412; --sheet: #111c19; --ink: #e2eee9; --muted: #8ea39b; --line: #25352f;
  --teal: #5cc2cf; --teal-soft: #16323a; --on-teal: #08201f; --orange: #ff8a4c; --grid: #1a2a25;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 1.5rem; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 1.0625rem/1.6 var(--sans);
  -webkit-font-smoothing: antialiased; }
a { color: var(--teal); }
code, .path { font-family: var(--mono); font-size: .85em; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; background: var(--sheet); padding: .5rem 1rem; }
.skip:focus { left: 1rem; top: 1rem; z-index: 50; }

.shell { display: grid; grid-template-columns: 13rem minmax(0, 1fr); gap: 3.5rem;
  max-width: 82rem; margin: 0 auto; padding: 2.5rem 2rem 5rem; }

/* ---------- nav ---------- */
nav { position: sticky; top: 2rem; align-self: start; font-size: .95rem; }
nav .repo { font-weight: 700; letter-spacing: -.01em; margin: 0 0 1rem; overflow-wrap: anywhere; line-height: 1.25; }
nav ul { list-style: none; margin: 0; padding: 0; }
nav li a { display: block; padding: .32rem 0 .32rem .9rem; color: var(--muted); text-decoration: none;
  border-left: 3px solid var(--line); line-height: 1.3; }
nav li a:hover { color: var(--ink); }
nav li a[aria-current="true"] { color: var(--ink); font-weight: 600; border-left-color: var(--orange); }
nav .theme { margin-top: 1.5rem; }

main { min-width: 0; }

/* ---------- hero ---------- */
.hero { padding-bottom: 2.5rem; }
.hero h1 { font-size: clamp(2.6rem, 6.2vw, 4.7rem); line-height: .98; letter-spacing: -.04em; font-weight: 800;
  margin: 0 0 1.2rem; overflow-wrap: anywhere; }
.hero .tagline { text-wrap: balance; font-size: clamp(1.15rem, 2vw, 1.4rem); line-height: 1.45; max-width: 40rem; margin: 0 0 1.5rem;
  color: var(--muted); font-weight: 450; }
.tags { display: flex; flex-wrap: wrap; gap: .45rem; margin: 0; padding: 0; list-style: none; }
.tag { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: .08rem .75rem;
  font-size: .86rem; background: var(--sheet); line-height: 1.5; }
.tag.type { background: var(--teal); border-color: var(--teal); color: var(--on-teal); font-weight: 600; }
.tag.inferred { border: 1px dashed var(--muted); color: var(--muted); background: transparent; }
.meta { color: var(--muted); font-size: .88rem; margin: 1.25rem 0 0; }

/* ---------- sections ---------- */
section { margin-top: 4.5rem; }
section:first-of-type { margin-top: 0; }
h2 { text-wrap: balance; font-size: clamp(1.5rem, 2.4vw, 1.9rem); letter-spacing: -.025em; line-height: 1.15; margin: 0 0 .5rem; font-weight: 700; }
h3 { font-size: 1.05rem; margin: 1.75rem 0 .25rem; }
.lede { text-wrap: pretty; max-width: 42rem; margin: 0 0 1.5rem; color: var(--muted); }

/* ---------- the sheet: diagram plate + title block ---------- */
.sheet { margin: 0; border: 1.5px solid var(--ink); background: var(--sheet); }
.plate { background-image: radial-gradient(var(--grid) 1.1px, transparent 1.2px); background-size: 20px 20px;
  background-position: 10px 10px; }
.canvas { overflow: auto; padding: 2rem 1.5rem; min-height: 9rem; display: flex; justify-content: center; align-items: center; }
.canvas svg { max-width: 100%; height: auto; flex: none; }
.tb { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; border-top: 1.5px solid var(--ink); }
.cell { padding: .55rem 1rem .6rem; border-left: 1px solid var(--ink); display: flex; flex-direction: column;
  gap: .2rem; justify-content: center; min-width: 0; }
.cell:first-child { border-left: 0; }
.cell > .tag { align-self: flex-start; }
.lab { font-size: .76rem; color: var(--muted); line-height: 1.2; }
.val { font-size: .95rem; font-weight: 600; line-height: 1.3; }
.ladder { display: flex; gap: .15rem; margin: 0; padding: 0; list-style: none; }
.ladder li { font-size: .88rem; padding: .1rem .55rem .15rem; border-bottom: 3px solid var(--line); color: var(--muted); }
.ladder li[aria-current="step"] { border-bottom-color: var(--orange); color: var(--ink); font-weight: 650; }
.cell.act { justify-content: center; align-items: center; }
.legend { color: var(--muted); font-size: .92rem; margin: .8rem 0 0; max-width: 46rem; }
.fail { color: var(--orange); font-weight: 500; }
button { font: inherit; font-size: .9rem; font-weight: 600; color: var(--ink); background: var(--sheet);
  border: 1.5px solid var(--ink); border-radius: 2px; padding: .3rem .9rem; cursor: pointer; }
button:hover:not(:disabled) { background: var(--ink); color: var(--sheet); }
button:disabled { opacity: .4; cursor: default; }
button.quiet { border: 0; background: none; color: var(--teal); padding: 0; font-weight: 500; text-decoration: underline;
  text-underline-offset: 3px; }
button.quiet:hover:not(:disabled) { background: none; color: var(--ink); }
details { margin-top: 1rem; }
summary { cursor: pointer; color: var(--muted); font-size: .92rem; }
pre { background: var(--sheet); border: 1px solid var(--line); padding: .9rem 1rem; overflow: auto;
  font: .82rem/1.55 var(--mono); }

/* ---------- start here ---------- */
ol.route { list-style: none; margin: 1.25rem 0 0; padding: 0; max-width: 54rem; counter-reset: step; }
ol.route li { counter-increment: step; display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); align-items: baseline;
  padding: .95rem 0; border-top: 1px solid var(--line); }
ol.route li:last-child { border-bottom: 1px solid var(--line); }
ol.route li::before { content: counter(step); font-size: 1.9rem; font-weight: 800; letter-spacing: -.04em; color: var(--teal); line-height: 1; }
ol.route .path { font-weight: 500; font-size: .95rem; display: inline-block; background: var(--teal-soft); color: var(--ink);
  padding: .05rem .5rem; margin-bottom: .2rem; overflow-wrap: anywhere; }
ol.route .why { display: block; color: var(--muted); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; margin-top: 1.5rem; }
table { width: 100%; border-collapse: collapse; font-size: .96rem; }
th { text-align: left; font-size: .82rem; font-weight: 600; color: var(--muted); padding: .4rem .9rem .5rem 0;
  border-bottom: 1.5px solid var(--ink); }
td { padding: .7rem .9rem .7rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td:first-child { font-weight: 600; }
td.path-cell { white-space: nowrap; }
td.path-cell .quiet { margin-left: .6rem; font-size: .82rem; }
.path-list { min-width: 15rem; }
.path-list .path { display: block; overflow-wrap: break-word; }

/* ---------- glossary / notes ---------- */
dl.gloss { max-width: 54rem; margin: 1.25rem 0 0; }
dl.gloss .row { display: grid; grid-template-columns: minmax(7rem, 13rem) minmax(0, 1fr); gap: 1.5rem;
  padding: .8rem 0; border-top: 1px solid var(--line); }
dl.gloss .row:last-child { border-bottom: 1px solid var(--line); }
dl.gloss dt { font-weight: 650; }
dl.gloss dd { margin: 0; color: var(--muted); }
ul.notes { max-width: 52rem; margin: .6rem 0 0; padding: 0; list-style: none; }
ul.notes li { padding: .15rem 0 .15rem 1rem; margin: .75rem 0; border-left: 3px solid var(--teal); }
ul.notes.unknown li { border-left: 3px dashed var(--muted); }
footer { margin-top: 5rem; color: var(--muted); font-size: .9rem; border-top: 1px solid var(--line); padding-top: 1rem; max-width: 46rem; }

/* ---------- viewer ---------- */
dialog { width: min(96vw, 110rem); height: 92vh; padding: 0; border: 1.5px solid var(--ink); background: var(--sheet); color: var(--ink); }
dialog::backdrop { background: rgba(5, 12, 10, .6); }
dialog .vhead { display: flex; align-items: center; gap: .5rem; padding: .6rem .9rem; border-bottom: 1.5px solid var(--ink); }
dialog .vtitle { font-weight: 700; flex: 1; }
dialog .vbody { height: calc(92vh - 3.4rem); overflow: auto; padding: 1.25rem;
  background-image: radial-gradient(var(--grid) 1.1px, transparent 1.2px); background-size: 20px 20px; }

@media (max-width: 64rem) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 1.25rem; padding: 1.25rem 1rem 3rem; }
  nav { position: static; }
  nav .repo { display: none; }
  nav ul { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .4rem; }
  nav li a { white-space: nowrap; border: 1px solid var(--line); border-left-width: 1px; border-radius: 999px; padding: .2rem .8rem; }
  nav li a[aria-current="true"] { border-color: var(--orange); }
  nav .theme { display: none; }
  section { margin-top: 3.25rem; }
  .tb { grid-template-columns: 1fr 1fr; }
  .cell { border-left: 0; }
  .cell:first-child { grid-column: 1 / -1; }
  .cell:nth-child(n+2) { border-top: 1px solid var(--ink); }
  .cell:nth-child(3) { border-left: 1px solid var(--ink); }
  .cell.act { grid-column: 1 / -1; align-items: flex-start; }
  .canvas { padding: 1rem; justify-content: flex-start; }
  dl.gloss .row { grid-template-columns: 1fr; gap: .2rem; }
}
@media print {
  nav, button, .skip { display: none !important; }
  .shell { display: block; padding: 0; }
  body { background: #fff; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>

<dialog id="viewer" aria-label="Diagram viewer">
  <div class="vhead">
    <span class="vtitle"></span>
    <button type="button" data-z="out" aria-label="Zoom out">&minus;</button>
    <button type="button" data-z="fit">Fit width</button>
    <button type="button" data-z="in" aria-label="Zoom in">+</button>
    <button type="button" data-z="close">Close</button>
  </div>
  <div class="vbody"></div>
</dialog>

<script id="spec" type="application/json">__SPEC_JSON__</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js" defer></script>
<script>
(function () {
  "use strict";
  var spec = JSON.parse(document.getElementById("spec").textContent);
  var LEVELS = ["Context", "Components", "Flow"];

  function el(tag, attrs) {
    var n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) {
        if (kids[j] == null) continue;
        n.append(kids[j].nodeType ? kids[j] : document.createTextNode(kids[j]));
      }
    }
    return n;
  }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function pathCode(p) { return el("code", { class: "path", text: p }); }
  function inferredTag(text) { return el("span", { class: "tag inferred", text: text || "inferred" }); }

  var sections = [];
  var drawn = [];
  var main = document.getElementById("main");
  document.title = (spec.repo_name || "Codebase") + " \u2013 codebase map";

  // ---- hero ----
  var hero = el("section", { id: "overview" },
    el("header", { class: "hero" },
      el("h1", { text: spec.repo_name }),
      el("p", { class: "tagline", text: spec.tagline })));
  var tags = el("ul", { class: "tags", "aria-label": "Repository type and stack" });
  (spec.repo_types || []).forEach(function (t) { tags.append(el("li", { class: "tag type", text: t })); });
  (spec.stack || []).forEach(function (t) { tags.append(el("li", { class: "tag", text: t })); });
  hero.firstChild.append(tags);
  if (spec.generated_from) hero.firstChild.append(el("p", { class: "meta", text: spec.generated_from }));
  main.append(hero);
  sections.push(["overview", "Overview"]);

  // ---- diagram sheets ----
  var diagrams = (spec.diagrams || []).slice().sort(function (a, b) { return a.level - b.level; });
  function sheetSection(d, index) {
    var host = el("div", { class: "canvas", role: "img", "aria-label": d.title + ". " + (d.summary || "") });
    var expand = el("button", { type: "button", text: "Expand" });
    var ladder = el("ol", { class: "ladder", "aria-label": "Zoom level" });
    LEVELS.forEach(function (name, i) {
      ladder.append(el("li", { text: name, "aria-current": i === d.level ? "step" : false }));
    });
    var basis = d.confidence === "inferred" ? inferredTag("Partly inferred") : el("span", { class: "val", text: "Seen in code" });
    var sheet = el("figure", { class: "sheet" },
      el("div", { class: "plate" }, host),
      el("figcaption", { class: "tb" },
        el("div", { class: "cell" }, el("span", { class: "lab", text: "Zoom level" }), ladder),
        el("div", { class: "cell" }, el("span", { class: "lab", text: "Sheet" }),
          el("span", { class: "val", text: (index + 1) + " of " + diagrams.length })),
        el("div", { class: "cell" }, el("span", { class: "lab", text: "Basis" }), basis),
        el("div", { class: "cell act" }, expand)));
    var sec = el("section", { id: "d-" + d.id },
      el("h2", { text: d.title }),
      el("p", { class: "lede", text: d.summary }),
      sheet);
    if (d.legend) sec.append(el("p", { class: "legend", text: d.legend }));
    sec.append(el("details", {}, el("summary", { text: "Diagram source (Mermaid)" }), el("pre", { text: d.mermaid })));
    if ((d.components || []).length) {
      var tb = el("tbody");
      d.components.forEach(function (c) {
        var copy = el("button", { type: "button", class: "quiet", text: "Copy", "aria-label": "Copy path " + c.path });
        copy.addEventListener("click", function () {
          try { navigator.clipboard.writeText(c.path); copy.textContent = "Copied"; setTimeout(function () { copy.textContent = "Copy"; }, 1200); } catch (e) {}
        });
        tb.append(el("tr", {},
          el("td", { text: c.name }),
          el("td", { class: "path-cell" }, pathCode(c.path), copy),
          el("td", {}, c.role, c.confidence === "inferred" ? [" ", inferredTag()] : null)));
      });
      sec.append(el("div", { class: "table-wrap" }, el("table", {},
        el("thead", {}, el("tr", {}, el("th", { text: "Component" }), el("th", { text: "Where" }), el("th", { text: "What it does" }))),
        tb)));
    }
    sections.push(["d-" + d.id, d.title]);
    drawn.push({ d: d, host: host, expand: expand });
    return sec;
  }

  // the context diagram is the opening view; the reading list follows it
  var shown = 0;
  diagrams.forEach(function (d, i) { if (d.level === 0) { main.append(sheetSection(d, i)); shown++; } });

  if ((spec.start_here || []).length) {
    var route = el("ol", { class: "route" });
    spec.start_here.forEach(function (s) {
      route.append(el("li", {}, el("div", {}, pathCode(s.path), el("span", { class: "why", text: s.why }))));
    });
    main.append(el("section", { id: "start-here" },
      el("h2", { text: "Start here" }),
      el("p", { class: "lede", text: "Read these in order. Together they explain most of how the code hangs together." }),
      route));
    sections.push(["start-here", "Start here"]);
  }
  diagrams.forEach(function (d, i) { if (d.level !== 0) main.append(sheetSection(d, i)); });

  // ---- where to change ----
  if ((spec.where_to_change || []).length) {
    var tb2 = el("tbody");
    spec.where_to_change.forEach(function (w) {
      var cell = el("td", { class: "path-list" });
      (w.paths || []).forEach(function (p) { cell.append(pathCode(p)); });
      tb2.append(el("tr", {}, el("td", { text: w.task }), cell, el("td", { text: w.notes || "" })));
    });
    main.append(el("section", { id: "where-to-change" },
      el("h2", { text: "Where to make common changes" }),
      el("div", { class: "table-wrap" }, el("table", {},
        el("thead", {}, el("tr", {}, el("th", { text: "If you need to\u2026" }), el("th", { text: "Look in" }), el("th", { text: "Notes" }))),
        tb2))));
    sections.push(["where-to-change", "Where to change things"]);
  }

  // ---- glossary ----
  if ((spec.glossary || []).length) {
    var dl = el("dl", { class: "gloss" });
    spec.glossary.forEach(function (g) {
      dl.append(el("div", { class: "row" }, el("dt", { text: g.term }), el("dd", { text: g.meaning })));
    });
    main.append(el("section", { id: "glossary" }, el("h2", { text: "Glossary" }), dl));
    sections.push(["glossary", "Glossary"]);
  }

  // ---- gotchas & open questions ----
  var notes = [["Gotchas", spec.gotchas, ""], ["Open questions", spec.open_questions, " unknown"]]
    .filter(function (x) { return (x[1] || []).length; });
  if (notes.length) {
    var ns = el("section", { id: "notes" }, el("h2", { text: "Gotchas and open questions" }));
    notes.forEach(function (x) {
      var ul = el("ul", { class: "notes" + x[2] });
      x[1].forEach(function (t) { ul.append(el("li", { text: t })); });
      ns.append(el("h3", { text: x[0] }), ul);
    });
    main.append(ns);
    sections.push(["notes", "Gotchas and questions"]);
  }

  main.append(el("footer", {},
    "Built from static analysis of the repository plus reading its key files. Anything outlined with a dashed line was not directly visible in code, so confirm it with the team before relying on it."));

  // ---- nav ----
  var nav = document.getElementById("nav");
  nav.append(el("p", { class: "repo", text: spec.repo_name }));
  var ul = el("ul");
  sections.forEach(function (s) { ul.append(el("li", {}, el("a", { href: "#" + s[0], text: s[1] }))); });
  nav.append(ul);
  var themeBtn = el("button", { type: "button", class: "theme", text: "Light / dark" });
  themeBtn.addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    renderAll();
  });
  nav.append(themeBtn);

  if ("IntersectionObserver" in window) {
    var links = {};
    [].forEach.call(ul.querySelectorAll("a"), function (a) { links[a.getAttribute("href").slice(1)] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          Object.keys(links).forEach(function (k) { links[k].removeAttribute("aria-current"); });
          links[e.target.id].setAttribute("aria-current", "true");
        }
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    Object.keys(links).forEach(function (k) { var t = document.getElementById(k); if (t) io.observe(t); });
  }

  // ---- diagram rendering ----
  var seq = 0;
  function showFailure(item, msg) {
    item.host.replaceChildren(el("div", {}, el("p", { class: "fail", text: msg }), el("pre", { text: item.d.mermaid })));
    item.expand.disabled = true;
  }
  function renderAll() {
    if (!window.mermaid) {
      drawn.forEach(function (it) {
        showFailure(it, "The diagram library could not be loaded (it comes from a CDN, so this needs an internet connection). The diagram source is shown below.");
      });
      return;
    }
    var ink = cssVar("--ink"), muted = cssVar("--muted"), sheet = cssVar("--sheet");
    window.mermaid.initialize({
      startOnLoad: false, securityLevel: "strict", theme: "base",
      flowchart: { curve: "linear", htmlLabels: true, padding: 14, nodeSpacing: 40, rankSpacing: 52 },
      sequence: { mirrorActors: false, actorMargin: 60 },
      themeVariables: {
        fontFamily: cssVar("--sans"), fontSize: "18px",
        primaryColor: cssVar("--teal-soft"), primaryTextColor: ink, primaryBorderColor: cssVar("--teal"),
        lineColor: muted, secondaryColor: sheet, tertiaryColor: sheet,
        clusterBkg: "transparent", clusterBorder: muted,
        edgeLabelBackground: sheet, noteBkgColor: sheet, noteTextColor: ink, noteBorderColor: muted,
        actorBkg: cssVar("--teal-soft"), actorBorder: cssVar("--teal"), actorTextColor: ink, actorLineColor: muted,
        signalColor: ink, signalTextColor: ink, labelBoxBkgColor: sheet, labelBoxBorderColor: muted,
        labelTextColor: ink, loopTextColor: ink, activationBkgColor: cssVar("--teal-soft"),
        activationBorderColor: cssVar("--teal"), sequenceNumberColor: sheet
      }
    });
    drawn.reduce(function (chain, it) {
      return chain.then(function () {
        var rid = "mmd" + (++seq);
        return window.mermaid.render(rid, it.d.mermaid).then(function (res) {
          it.host.innerHTML = res.svg;
          it.expand.disabled = false;
        }).catch(function (err) {
          var junk = document.getElementById("d" + rid);
          if (junk) junk.remove();
          showFailure(it, "This diagram could not be drawn: " + ((err && err.message) || err));
        });
      });
    }, Promise.resolve()).then(fitSvgs);
  }

  function fitSvgs() {
    var narrow = window.matchMedia && matchMedia("(max-width: 64rem)").matches;
    drawn.forEach(function (it) {
      var svg = it.host.querySelector("svg");
      if (!svg || !svg.viewBox || !svg.viewBox.baseVal || !svg.viewBox.baseVal.width) return;
      if (narrow) { svg.style.maxWidth = "none"; svg.style.width = svg.viewBox.baseVal.width + "px"; }
      else { svg.style.maxWidth = ""; svg.style.width = ""; }
    });
  }

  // ---- viewer ----
  var dlg = document.getElementById("viewer");
  var vbody = dlg.querySelector(".vbody");
  var zoom = 1, vsvg = null;
  function applyZoom() { if (vsvg) vsvg.style.width = (zoom * 100) + "%"; }
  drawn.forEach(function (it) {
    it.expand.addEventListener("click", function () {
      var svg = it.host.querySelector("svg");
      if (!svg) return;
      dlg.querySelector(".vtitle").textContent = it.d.title;
      vsvg = svg.cloneNode(true);
      vsvg.removeAttribute("height");
      vsvg.style.maxWidth = "none";
      zoom = 1;
      vbody.replaceChildren(vsvg);
      applyZoom();
      dlg.showModal();
    });
  });
  dlg.addEventListener("click", function (e) {
    var z = e.target && e.target.getAttribute && e.target.getAttribute("data-z");
    if (z === "in") { zoom = Math.min(zoom * 1.25, 6); applyZoom(); }
    else if (z === "out") { zoom = Math.max(zoom / 1.25, 0.4); applyZoom(); }
    else if (z === "fit") { zoom = 1; applyZoom(); }
    else if (z === "close" || e.target === dlg) dlg.close();
  });

  window.addEventListener("load", renderAll);
  if (window.matchMedia) {
    matchMedia("(max-width: 64rem)").addEventListener("change", fitSvgs);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
      if (!document.documentElement.dataset.theme) renderAll();
    });
  }
})();
</script>
</body>
</html>
